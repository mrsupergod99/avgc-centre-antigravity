<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KONKANIGO — Amchi Bhaas, Amche Goem</title>
  <meta name="description" content="AI-Powered Konkani Language Learning & Goan Cultural Discovery Platform" />
  <meta name="theme-color" content="#D35400" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KonkaniGO" />

  <!-- Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/jpeg" href="./assets/icons/app-icon.jpg" />
  <link rel="apple-touch-icon" href="./assets/icons/app-icon.jpg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- Google Fonts: Inter & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="./css/mascot.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/tourist.css" />
</head>
<body>
  <!-- App Mobile-First Root Shell -->
  <div id="app">
    <!-- Dynamic View Screen Content -->
    <main id="mainContent" role="main"></main>

    <!-- Bottom Navigation Bar (Home, Learn, Explore, AI, Profile) -->
    <nav id="bottomNav" class="bottom-nav" aria-label="Main Navigation">
      <button class="nav-item active" data-view="home" aria-label="Home Dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Home</span>
      </button>

      <button class="nav-item" data-view="learn" aria-label="Learn Konkani">
        <span class="nav-icon">🎮</span>
        <span class="nav-label">Learn</span>
      </button>

      <button class="nav-item" data-view="explore" aria-label="Explore Goa Culture">
        <span class="nav-icon">🏛️</span>
        <span class="nav-label">Explore</span>
      </button>

      <button class="nav-item" data-view="ai" aria-label="AI Coach">
        <span class="nav-icon">💬</span>
        <span class="nav-label">AI Coach</span>
      </button>

      <button class="nav-item" data-view="profile" aria-label="User Profile">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </button>
    </nav>
  </div>

  <!-- Main ES Module Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>

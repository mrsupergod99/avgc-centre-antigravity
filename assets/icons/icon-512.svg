<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C2340" />
      <stop offset="100%" stop-color="#1A5276" />
    </linearGradient>
    <linearGradient id="fishGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="50%" stop-color="#D35400" />
      <stop offset="100%" stop-color="#C0392B" />
    </linearGradient>
  </defs>

  <!-- Deep Sea Navy Round Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad512)" />

  <!-- Sun Rays / Cultural Wave -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2980B9" stroke-width="4" stroke-dasharray="10,14" opacity="0.4" />

  <!-- Torli Fish Silhouette -->
  <!-- Tail -->
  <path d="M 120 256 Q 60 190 70 280 Q 60 350 120 290 Z" fill="#F39C12" />
  <!-- Dorsal -->
  <path d="M 210 180 Q 260 130 310 185 Z" fill="#F39C12" />
  <!-- Body -->
  <ellipse cx="260" cy="260" rx="120" ry="90" fill="url(#fishGrad512)" />
  <!-- Belly -->
  <path d="M 190 280 Q 260 330 330 280 Q 260 300 190 280 Z" fill="#FCF3CF" />
  <!-- Eye -->
  <ellipse cx="320" cy="235" rx="18" ry="24" fill="#FFFFFF" />
  <circle cx="324" cy="238" r="10" fill="#0C2340" />
  <circle cx="328" cy="232" r="4" fill="#FFFFFF" />
  <!-- Happy Smile -->
  <path d="M 340 268 Q 355 285 370 268" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Pectoral Fin -->
  <path d="M 220 256 Q 195 295 230 315 Q 240 290 235 256 Z" fill="#2980B9" />

  <!-- Festive Sao Joao Kopel Wreath -->
  <g>
    <circle cx="210" cy="150" r="14" fill="#E74C3C" />
    <circle cx="240" cy="140" r="16" fill="#F1C40F" />
    <circle cx="270" cy="140" r="15" fill="#E67E22" />
    <circle cx="300" cy="150" r="14" fill="#9B59B6" />
  </g>

  <!-- KonkaniGO Title Text -->
  <text x="256" y="420" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="38" letter-spacing="3">KONKANIGO</text>
  <text x="256" y="450" text-anchor="middle" fill="#F39C12" font-family="sans-serif" font-weight="700" font-size="16" letter-spacing="1">AMCHI BHAAS, AMCHE GOEM</text>
</svg>
